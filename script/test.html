<script src="transparentlottery.js"></script>

<h1>Test of TransparentLottery class</h1>

<h2>Results:</h2>
<ul id="results"></ul>

<script type="module">

    class Assert extends Error {
        constructor(message) {
            super(message);
        }
    }

    function result(message)
    {
        let item = document.createElement("li");
        item.innerHTML = message;
        document.getElementById("results").appendChild(item);
        return message;
    }

    /* Base */
    try {
        new TransparentLottery();
        throw new Assert(result("Base failed!"));
    } catch (error) {
        if (error instanceof Assert) {
            throw error;
        }
    };
    try {
        new TransparentLottery(0);
        throw new Assert(result("Base failed!"));
        } catch (error) {
            if (error instanceof Assert) {
                throw error;
            }
        };
    try {
        new TransparentLottery(3);
        throw new Assert(result("Base failed!"));
    } catch (error) {
        if (error instanceof Assert) {
            throw error;
        }
    };
    try {
        new TransparentLottery(1);
        throw new Assert(result("Base failed!"));
    } catch (error) {
        if (error instanceof Assert) {
            throw error;
        }
    };
    try {
        new TransparentLottery(257);
        throw new Assert(result("Base failed!"));
    } catch (error) {
        if (error instanceof Assert) {
            throw error;
        }
    };

    result("Base OK");

    /* Height */
    try {
        new TransparentLottery(2);
        throw new Assert(result("Height failed!"));
    } catch (error) {
        if (error instanceof Assert) {
            throw error;
        };
    }
    try {
        new TransparentLottery(2, -1);
        throw new Assert(result("Height failed!"));
    } catch (error) {
        if (error instanceof Assert) {
            throw error;
        }
    };

    result("Height OK");

    /* Roll */
    try {
        new TransparentLottery(2, 0, -1);
        throw new Assert(result("Roll failed!"));
    } catch (error) {
        if (error instanceof Assert) {
            throw error;
        }
    };

    result("Roll OK");

    /* Terminal */
    try {
        new TransparentLottery(2, 0, 0, 0);
        throw new Assert(result("Terminal failed!"));
    } catch (error) {
        if (error instanceof Assert) {
            throw error;
        }
    };

    result("Terminal OK");

    /* Initializations */
    try {
        new TransparentLottery(2, 0);
        new TransparentLottery(256, 0);
        new TransparentLottery(2, 0, 0);

        let terminal = document.createElement("div");
        let testerInitialization = new TransparentLottery(2, 0, 0, terminal);

        if (testerInitialization._base != 2) {
        throw new Assert(result("Base failed!"));
        }
        if (testerInitialization._height != 0) {
        throw new Assert(result("Height failed!"));
        }
        if (testerInitialization._roll != 0) {
        throw new Assert(result("Roll failed!"));
        }
        if (testerInitialization._terminal != terminal) {
        throw new Assert(result("Terminal failed!"));
        }
    } catch (error) {
        if (error instanceof Assert) {
            throw error;
        }
    };

    result("Initialization OK");

    /* Get Block */
    let terminal = document.createElement("div");
    let testerGetBlock = new TransparentLottery(2, 0, 0, terminal);
    await testerGetBlock._getBlock();

    if (testerGetBlock._hash != "000000000019d6689c085ae165831e934ff763ae46a2a6c172b3f1b60a8ce26f") {
    throw new Assert(result("Get block Hash failed!"));
    }
    if (testerGetBlock._instant != "03/01/2009, 16:15:05") {
    throw new Assert(result("Get block Instant failed!"));
    }

    if (testerGetBlock._terminal.innerHTML != '<p>Getting <b>block</b> <code>0</code> from <b>Bitcoin Mempool</b>...</p><p>The <b>hash</b> of <b>block</b> <code>0</code> is <code>000000000019d6689c085ae165831e934ff763ae46a2a6c172b3f1b60a8ce26f</code>.</p><p>It was mined at 03/01/2009, 16:15:05.</p><p>Check it out at <a href="https://mempool.space/block/000000000019d6689c085ae165831e934ff763ae46a2a6c172b3f1b60a8ce26f">https://mempool.space/block/000000000019d6689c085ae165831e934ff763ae46a2a6c172b3f1b60a8ce26f</a>.</p><p>The <b>Seed Draw Number</b> is <code>000000000019d6689c085ae165831e934ff763ae46a2a6c172b3f1b60a8ce26f</code>.</p>') {
    throw new Assert(result("Get block Terminal failed!"));
    }

    result("Get Block OK");

</script>

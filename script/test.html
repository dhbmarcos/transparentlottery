<script src="transparentlottery.js"></script>

<h1>Test of TransparentLottery class</h1>

<h2>Results:</h2>
<ul id="results"></ul>

<script type="module">

    class Assert extends Error {
        constructor(message) {
            super(message);
        }
    }

    function result(message)
    {
        let item = document.createElement("li");
        item.innerHTML = message;
        document.getElementById("results").appendChild(item);
        return message;
    }

    /* Base */
    try {
        new TransparentLottery();
        throw new Assert(result("Base failed!"));
    } catch (error) {
        if (error instanceof Assert) {
            throw error;
        }
    };
    try {
        new TransparentLottery(0);
        throw new Assert(result("Base failed!"));
        } catch (error) {
            if (error instanceof Assert) {
                throw error;
            }
        };
    try {
        new TransparentLottery(1);
        throw new Assert(result("Base failed!"));
    } catch (error) {
        if (error instanceof Assert) {
            throw error;
        }
    };
    try {
        new TransparentLottery(257);
        throw new Assert(result("Base failed!"));
    } catch (error) {
        if (error instanceof Assert) {
            throw error;
        }
    };

    result("Base OK");

    /* Height */
    try {
        new TransparentLottery(2, -1);
        throw new Assert(result("Height failed!"));
    } catch (error) {
        if (error instanceof Assert) {
            throw error;
        }
    };

    result("Height OK");

    /* Terminal */
    try {
        new TransparentLottery(2, 0, 0);
        throw new Assert(result("Terminal failed!"));
    } catch (error) {
        if (error instanceof Assert) {
            throw error;
        }
    };

    result("Terminal OK");

    /* Initializations */
    new TransparentLottery(2);
    new TransparentLottery(256);

    let terminalInitialization = document.createElement("div");
    let testerInitialization = new TransparentLottery(2, 0, terminalInitialization);

    if (testerInitialization._base != 2) {
        throw new result("Base failed!");
    }
    if (testerInitialization._height != 0) {
        throw new result("Height failed!");
    }
    if (testerInitialization._terminal != terminalInitialization) {
        throw new result("Terminal failed!");
    }

    result("Initialization OK");

    /* Get Current Height */
    let terminalGetCurrentHeight = document.createElement("div");

    let testerGetCurrentHeight = new TransparentLottery(2, undefined, terminalGetCurrentHeight);
    await testerGetCurrentHeight._getCurrentHeight();
    if (!testerGetCurrentHeight._height) {
        throw new result("Get Current Height failed!");
    }
    result("Get Current Height OK");

    /* Get Block Estimation */
    let terminaGetBlockEstimation = document.createElement("div");
    let testerGetBlockEstimation  = new TransparentLottery(2, 1000000, terminaGetBlockEstimation);
    await testerGetBlockEstimation._getBlockEstimate();

    if (testerGetBlockEstimation._seed != null) {
        throw new result("Get Block Estimation Hash failed!");
    }
    if (new Date().getTime() > Date.parse(testerGetBlockEstimation._instant)) {
        throw new result("Get Block Estimation Instant failed!");
    }

    /* Get Seed */
    let terminalGetSeed = document.createElement("div");

    let testerGetSeed0 = new TransparentLottery(2, 0, terminalGetSeed);
    await testerGetSeed0._getSeed();
    if (testerGetSeed0._seed != "000000000019d6689c085ae165831e934ff763ae46a2a6c172b3f1b60a8ce26f") {
        throw new result("Get Seed Hash failed!");
    }
    if (testerGetSeed0._instant != "2009-01-03T18:15:05.000Z") {
        throw new result("Get Seed Instant failed!");
    }
    if (testerGetSeed0._terminal.innerHTML != '<p>Get the hash of block <code>0</code> from <b>Bitcoin Mempool</b> (<a href="https://mempool.space/api/block-height/0">https://mempool.space/api/block-height/0</a>)...</p><p>The <b>hash</b> of <b>block</b> <code>0</code> is <code>000000000019d6689c085ae165831e934ff763ae46a2a6c172b3f1b60a8ce26f</code>.</p><p>It was mined at 2009-01-03T18:15:05.000Z.</p><p>Check it out at <a href="https://mempool.space/block/000000000019d6689c085ae165831e934ff763ae46a2a6c172b3f1b60a8ce26f">https://mempool.space/block/000000000019d6689c085ae165831e934ff763ae46a2a6c172b3f1b60a8ce26f</a>.</p><p><b>Seed Draw Number</b>: <code>000000000019d6689c085ae165831e934ff763ae46a2a6c172b3f1b60a8ce26f</code>.</p>') {
        throw new result("Get Seed Terminal failed!");
    }

    let testerGetSeed1 = new TransparentLottery(2, 1000000, terminalGetSeed);
    await testerGetSeed1._getSeed();
    if (testerGetSeed1._seed != null) {
        throw new result("Get Seed Hash failed!");
    }
    if (new Date().getTime() > Date.parse(testerGetSeed1._instant)) {
        throw new result("Get Seed Instant failed!");
    }
    result("Get Seed OK");

    /* */

    console.log("---")

    let tl = new TransparentLottery(2);
    tl.draw();


</script>
